# External dataset registry.
#
# STATUS VOCABULARY (research-integrity rules, plan section 29):
#   verified            -- the official source page was fetched and the stated
#                          facts were confirmed on 2026-08-28.
#   ACCESS UNVERIFIED   -- the paper is real and cited correctly, but the download
#                          mechanism, licence or terms were NOT confirmed here.
#   manual              -- a human must accept terms / obtain credentials.  The
#                          tooling will never attempt an automated download.
#
# NOTHING in this file is downloaded automatically.  `scripts/download_datasets.sh`
# prints instructions and refuses to fetch any dataset whose licence or download
# permission is not `verified`.  See docs/DATASET_MATRIX.md for the full matrix.

registry_version: "1.0"
verified_on: "2026-08-28"
verification_method: "web search + official page fetch; see docs/LITERATURE_CROSS_RESEARCH.md"

datasets:

  layereddepth:
    title: "LayeredDepth (Seeing and Seeing Through the Glass)"
    venue: "ICCV 2025"
    arxiv: "2503.11633"
    official_repo: "https://github.com/princeton-vl/LayeredDepth"
    paper_page: "https://openaccess.thecvf.com/content/ICCV2025/html/Wen_Seeing_and_Seeing_Through_the_Glass_Real_and_Synthetic_Data_ICCV_2025_paper.html"
    status: verified
    licence: "benchmark data stated as CC0 on the official repository"
    licence_status: verified
    automated_download_permitted: unknown      # repo confirmed; exact asset URLs not fetched here
    download_mechanism: manual
    approx_size_gb: null
    authentication_required: false
    contents: "1,500 real images with multi-layer depth annotations (~14.2M relative-depth tuples); 15,300 synthetic images from a procedural generator (LayeredDepth-Syn, built on Infinigen Indoor)"
    intervene3d_role: "external test: does the model preserve interface vs behind-glass depth instead of collapsing them?"
    priority: 5
    expected_layout: "data/raw/layereddepth/{real,synthetic}/..."
    instructions: |
      1. Read the licence and usage terms at https://github.com/princeton-vl/LayeredDepth
      2. Follow the repository's own download instructions.
      3. Place the result under data/raw/layereddepth/ and run
         python scripts/validate_datasets.py --dataset layereddepth

