action_noise:
  enabled: false
  rotation_std_deg: 0.0
  translation_std: 0.0
classifier_epochs: 600
data:
  dataset_dir: null
  reseed_with_experiment_seed: true
  split: test
  synthetic_config: configs/synthetic/phase1.yaml
experiment:
  kind: phase1_problem_existence
  name: phase1_selector_study
  root: experiments
  seed: 3
mcrb:
  max_baseline: 0.35
  num_baseline_samples: 41
methods:
- classifier: passive_multiview
  description: The strongest non-abstaining baseline; the CEA number to beat.
  kind: classifier
  name: passive_multiview_classifier
- description: Move as far as allowed. The strongest hypothesis-blind intervention.
  kind: engine
  name: max_baseline_intervention
  selector: max_baseline
- description: The published objective, argmax over the belief-weighted SUM of pairwise
    separabilities. Retained as the ablation the new selector is measured against.
  kind: engine
  name: intervene3d_sum
  selector: max_separability
- description: argmax over the WEAKEST still-contended pair. A decision needs every
    contending pair separated, so the binding quantity is the minimum.
  kind: engine
  name: intervene3d_maxmin
  selector: max_min_separability
- abstention: false
  description: Forced choice, for a like-for-like CEA comparison with the classifiers.
  kind: engine
  name: intervene3d_maxmin_forced
  selector: max_min_separability
metrics:
- causal_explanation_accuracy
- contact_depth_error
- identifiability_auroc
- mcrb_error
- fpcr
- intervention_regret
model:
  abstention:
    enabled: true
    tau: 0.45
  belief:
    beta: 1.0
    floor: 1.0e-06
  distance:
    lambda_feature: 0.0
    lambda_geometry: 0.0
    lambda_motion: 1.0
    lambda_occlusion: 4.0
  geometry_encoder:
    name: ground_truth
  identifiability:
    epsilon_px: 1.0
  transition:
    name: analytical
passive_action: null
visualization:
  column: single
  dpi: 400
  formats:
  - pdf
  - png
  ieee: true
