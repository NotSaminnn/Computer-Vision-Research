action_noise:
  enabled: false
  rotation_std_deg: 0.0
  translation_std: 0.0
classifier_epochs: 600
data:
  dataset_dir: null
  reseed_with_experiment_seed: true
  split: test
  synthetic_config: configs/synthetic/benchmark_core.yaml
experiment:
  kind: phase1_problem_existence
  name: phase2_benchmark_core
  root: experiments
  seed: 3
mcrb:
  max_baseline: 0.35
  num_baseline_samples: 41
methods:
- classifier: single_frame
  kind: classifier
  name: single_frame_classifier
- classifier: passive_multiview
  kind: classifier
  name: passive_multiview_classifier
- kind: engine
  name: max_baseline_intervention
  selector: max_baseline
- kind: engine
  name: intervene3d_sum
  selector: max_separability
- kind: engine
  name: intervene3d_maxmin
  selector: max_min_separability
- abstention: false
  kind: engine
  name: intervene3d_maxmin_forced
  selector: max_min_separability
metrics:
- causal_explanation_accuracy
- contact_depth_error
- identifiability_auroc
- mcrb_error
- fpcr
- intervention_regret
model:
  abstention:
    enabled: true
    tau: 0.45
  belief:
    beta: 1.0
    floor: 1.0e-06
  distance:
    lambda_feature: 0.0
    lambda_geometry: 0.0
    lambda_motion: 1.0
    lambda_occlusion: 4.0
  geometry_encoder:
    name: ground_truth
  identifiability:
    epsilon_px: 1.0
  transition:
    name: analytical
passive_action: null
visualization:
  column: single
  dpi: 400
  formats:
  - pdf
  - png
  ieee: true
